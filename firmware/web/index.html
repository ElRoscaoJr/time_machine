<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniela’s Time Machine</title>
<!-- styles -->
</head>
<body>
<header><a class="brand" href="/"><!-- profile-avatar -->Daniela’s Time Machine</a><span id="ip"></span></header>
<main>
  <section id="panel">
    <div class="intro"><div><h1 id="title">Biblioteca</h1><p id="summary"></p></div>
    <label class="button" id="upload-control">Añadir fotos<input id="files" type="file" accept="image/*,.heic,.heif" multiple></label></div>
    <p id="empty" hidden>Añade fotos para empezar la línea del tiempo.</p>
    <div id="photos" class="photos"></div>
    <nav id="pages" aria-label="Páginas de fotos">
      <button id="prev" class="secondary">Anterior</button><span id="page"></span><button id="next" class="secondary">Siguiente</button>
    </nav>
    <details>
      <summary>Foto de perfil</summary>
      <label>Elegir imagen<input id="profile-file" type="file" accept="image/*"></label>
      <p id="profile-status" role="status"></p>
    </details>
    <details id="network">
      <summary>Conexión Wi-Fi</summary>
      <p>Tras conectar el aparato al Wi-Fi, abre en tu navegador la IP que aparezca en su pantalla.</p>
      <form id="wifi"><label>Red guardada<select name="slot"><option value="0">Red 1</option><option value="1">Red 2</option></select></label>
      <label>Nombre de la red de 2,4 GHz<input name="ssid" maxlength="32" required></label>
      <label>Contraseña de la red<input name="password" type="password" maxlength="64" autocomplete="off"></label>
      <div class="actions"><button>Guardar y conectar</button>
      <button class="secondary" value="store">Solo guardar</button></div></form>
      <p id="wifi-status" role="status"></p>
    </details>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<dialog id="photo-dialog">
  <form id="photo-form">
    <div class="intro"><h2 id="dialog-title">Foto</h2><button type="button" id="close" class="secondary" aria-label="Cerrar">Cerrar</button></div>
    <div id="preview"></div>
    <p id="file-progress"></p>
    <label>Fecha de la foto<input name="date" type="date" max="9999-12-31"></label>
    <label>Lugar<input name="place" maxlength="160" placeholder="Nombre del lugar"></label>
    <div class="pair">
      <label>Latitud<input name="lat" type="number" min="-90" max="90" step="any"></label>
      <label>Longitud<input name="lon" type="number" min="-180" max="180" step="any"></label>
    </div>
    <button id="clear-gps" type="button" class="secondary">Quitar ubicación</button>
    <label>Nota<textarea name="note" rows="5" maxlength="4096"></textarea></label>
    <p id="photo-status" role="status" aria-live="polite"></p>
    <div class="actions"><button id="save">Guardar</button><button type="button" id="skip" class="secondary">Omitir</button><button type="button" id="delete" class="danger">Borrar foto</button></div>
  </form>
</dialog>
<!-- scripts -->
</body>
</html>
